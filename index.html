<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="「WebページをPDFで保存」を Chrome のツールバーに固定すると、どのウェブページも PDF として保存できます。"
    >
    <title>「WebページをPDFで保存」がインストールされました！使い始める方法をご案内します。</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css?v=ja-label-1">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">「WebページをPDFで保存」<span class="headline-keep">がインストールされました！&nbsp;🎉</span></span>
          <span class="headline-sub">さっそく使い始めましょう。</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Chrome の右上にある拡張機能（1）を開き、「WebページをPDFで保存」の横にある固定アイコン（2）をクリックしてください。
        </h2>
        <figure class="browser-shot browser-shot--localized">
          <img src="assets/pin-extension.png" alt="Chrome の拡張機能を開き、「WebページをPDFで保存」を固定する">
          <svg class="localized-label" viewBox="0 0 2600 1193" aria-hidden="true" focusable="false">
            <rect x="1848" y="463" width="335" height="42" fill="#fafbfc" />
            <text x="1854" y="496" fill="#000000" font-family="Arial, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif" font-size="26">WebページをPDFで保存</text>
          </svg>
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          準備完了です。ウェブページを保存したいときは、PDF アイコン（3）をクリックしてください。
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Chrome のツールバーにある「WebページをPDFで保存」のアイコンをクリックする">
        </figure>
      </section>
    </main>
  </body>
</html>
